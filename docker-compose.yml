# DEVELOPMENT stack (your PC). Not for production: see docker-compose.prod.yml and docs/DEPLOYMENT.md.
#
# Every published port is bound to 127.0.0.1, so nothing here is reachable from other machines on your network.
#
# The values below marked DEV ONLY are throwaway values for a database that holds no real data. They are not secrets and
# must never be reused anywhere else. To use your own, copy .env.dev.example to .env.dev and run
#   docker compose --env-file .env.dev up
services:
  db:
    image: mysql:8.4.9
    environment:
      # DEV ONLY throwaway credentials.
      MYSQL_ROOT_PASSWORD: ${OC_DEV_DB_ROOT_PASSWORD:-dev-only-root-not-a-secret}
      MYSQL_DATABASE: opencanvas_db
    volumes:
      - ./data/dev/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Published on this PC only (127.0.0.1), so a desktop client such as DBeaver can connect to localhost:3307.
    ports:
      - "127.0.0.1:3307:3306"

  backend:
    build: ./backend
    # seed_dev_users creates or updates the demo accounts named in .env.dev (DEV_SEED_*). With those variables empty it
    # does nothing. It refuses to run unless DEBUG is on, so it can never run in production.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_dev_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      # Uploaded files (photos, videos, documents) land here on your PC instead of inside ./backend.
      - ./data/dev/uploads:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # DEV ONLY throwaway values (see the note at the top of this file).
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-only-never-use-in-production
      - DB_NAME=opencanvas_db
      - DB_USER=root
      - DB_PASSWORD=${OC_DEV_DB_ROOT_PASSWORD:-dev-only-root-not-a-secret}
      - DB_HOST=db
      - DB_PORT=3306
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      # Optional demo accounts (DEV ONLY, read from .env.dev through the --env-file option; empty values create nothing).
      - DEV_SEED_ADMIN_USERNAME=${DEV_SEED_ADMIN_USERNAME:-}
      - DEV_SEED_ADMIN_EMAIL=${DEV_SEED_ADMIN_EMAIL:-}
      - DEV_SEED_ADMIN_PASSWORD=${DEV_SEED_ADMIN_PASSWORD:-}
      - DEV_SEED_LECTURER_USERNAME=${DEV_SEED_LECTURER_USERNAME:-}
      - DEV_SEED_LECTURER_EMAIL=${DEV_SEED_LECTURER_EMAIL:-}
      - DEV_SEED_LECTURER_PASSWORD=${DEV_SEED_LECTURER_PASSWORD:-}
      - DEV_SEED_STUDENT_USERNAME=${DEV_SEED_STUDENT_USERNAME:-}
      - DEV_SEED_STUDENT_EMAIL=${DEV_SEED_STUDENT_EMAIL:-}
      - DEV_SEED_STUDENT_PASSWORD=${DEV_SEED_STUDENT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm start"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    stdin_open: true
    tty: true

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  frontend_node_modules:
