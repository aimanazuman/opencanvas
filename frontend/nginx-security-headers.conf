# Security headers, included in EVERY location of nginx.conf.
# Why an include file: in nginx, an add_header inside a location block cancels all add_header lines inherited from the
# server block. So each location that sets its own headers (such as Cache-Control) must repeat these too.
#
# HSTS is not set here: Traefik (middleware opencanvas-sec) and Cloudflare set it.
#
# Content-Security-Policy, and why each part is as wide as it is:
#   default-src 'self'            everything not listed below may only come from this site
#   script-src 'self'             only the bundled scripts (the Docker build disables the inline runtime chunk)
#   style-src 'self' 'unsafe-inline'   components set style="..." attributes; no external stylesheets are used
#   img-src ... https:           board images can be any https address (and YouTube thumbnails); data: and blob: for previews
#   media-src ... https:         audio and video blocks
#   frame-src 'self' blob: https: board blocks embed YouTube, Vimeo, Google Meet and any https link; the PDF preview shows a blob: URL
#   connect-src 'self' blob:     the API is on the same origin (/api)
#   object-src 'none'            no plug-ins
#   frame-ancestors 'self'       only this site may frame the site
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' blob:; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
