# Served by nginx-unprivileged: runs as uid 101 and listens on 8080 (Traefik sends traffic to this port).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Never serve dotfiles (.env, .git, .htaccess ...).
    location ~ /\. {
        deny all;
        return 404;
    }

    # Django admin and REST framework files (admin CSS and JavaScript), collected by the backend into the shared
    # static folder, mounted read-only at /srv/django-static. Must come before the React /static/ block below.
    location ^~ /static/admin/ {
        alias /srv/django-static/admin/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ^~ /static/rest_framework/ {
        alias /srv/django-static/rest_framework/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # React build assets have a content hash in the file name, so they can be cached for a year.
    location /static/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: all routes fall back to index.html, which must never be cached (it names the hashed bundles).
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
